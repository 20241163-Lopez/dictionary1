<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Networking Dictionary</title>
  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app">

    <header>
      <h1>Networking Dictionary</h1>
      <p class="lead">Quickly find networking terms, definitions, and examples</p>
    </header>

    <div class="search-row">
      <input id="q" type="search" placeholder="Search a Networking term (e.g. IP Address)">
      <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i> Search</button>
    </div>

    <div class="controls">
      <button class="btn-ghost" id="randomBtn"><i class="fas fa-dice"></i> Random</button>
      <button class="btn-ghost" id="clearBtn"><i class="fas fa-trash"></i> Clear</button>
    </div>

    <section id="result" class="result"></section>

    <div class="side">
      <div>
        <h3><i class="fas fa-history"></i> History</h3>
        <ul id="historyList"></ul>
      </div>
      <div>
        <h3><i class="fas fa-star"></i> Favorites</h3>
        <ul id="favList"></ul>
      </div>
      <div>
  <h3><i class="fas fa-history"></i> History</h3>
  <ul id="historyList"></ul>
  <button class="btn-ghost" id="clearHistoryBtn"><i class="fas fa-trash"></i> Clear History</button>
</div>

    </div>

    <section class="contact-form">
      <h2>Connect with Us</h2>
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Your Email">
      <textarea placeholder="Your Message"></textarea>
      <button class="search-btn">Send Message</button>

      <div class="social-icons">
        <a href="#" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
        <a href="#" target="_blank"><i class="fab fa-linkedin-in"></i></a>
        <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
      </div>
    </section>

    <footer>
      &copy; 2025 Networking Dictionary | Lopez, Balles, Regis, Cloma [GROUP 10]
    </footer>

  </div>

  <!-- SCRIPT -->
  <script src="script.js"></script>
</body>
</html>
